<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img" aria-labelledby="title desc">
  <title id="title">Harmonogram EUDIW - klíčové termíny 2024-2027</title>
  <desc id="desc">Časová osa legislativních milníků evropské peněženky digitální identity od účinnosti nařízení po povinnost akceptace u spoléhajících stran.</desc>
  <defs>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2b6aff"/>
      <stop offset="100%" stop-color="#00d4ff"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141a2e"/>
      <stop offset="100%" stop-color="#0f1324"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="960" height="320" rx="16" fill="#12162a"/>
  <rect x="1" y="1" width="958" height="318" rx="15" fill="none" stroke="rgba(255,255,255,0.12)"/>

  <text x="32" y="36" fill="#4f8cff" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="0.08em">LEGISLATIVNÍ HARMONOGRAM</text>
  <text x="32" y="58" fill="#e8edf5" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700">EUDIW - klíčové termíny 2024-2027</text>

  <line x1="48" y1="170" x2="912" y2="170" stroke="url(#lineGrad)" stroke-width="3" stroke-linecap="round"/>

  <circle cx="120" cy="170" r="7" fill="#2b6aff" stroke="#12162a" stroke-width="2"/>
  <rect x="56" y="188" width="128" height="88" rx="10" fill="url(#cardGrad)" stroke="rgba(79,140,255,0.25)"/>
  <text x="68" y="208" fill="#4f8cff" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700">20. 5. 2024</text>
  <text x="68" y="228" fill="#e8edf5" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">Nařízení</text>
  <text x="68" y="246" fill="#8892b0" font-family="Inter, system-ui, sans-serif" font-size="10">eIDAS 2.0</text>
  <text x="68" y="262" fill="#8892b0" font-family="Inter, system-ui, sans-serif" font-size="10">(EU 2024/1183)</text>

  <circle cx="300" cy="170" r="9" fill="#00d4ff" stroke="#12162a" stroke-width="2" filter="url(#glow)"/>
  <rect x="228" y="78" width="144" height="82" rx="10" fill="url(#cardGrad)" stroke="rgba(0,212,255,0.35)"/>
  <text x="240" y="98" fill="#00d4ff" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700">24. 12. 2024 *</text>
  <text x="240" y="118" fill="#e8edf5" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">IR k peněžence</text>
  <text x="240" y="136" fill="#8892b0" font-family="Inter, system-ui, sans-serif" font-size="10">Kotva 24/36 měs.</text>
  <text x="240" y="152" fill="#8892b0" font-family="Inter, system-ui, sans-serif" font-size="10">2024/2977-2982</text>
  <line x1="300" y1="160" x2="300" y2="163" stroke="rgba(0,212,255,0.5)" stroke-width="1"/>

  <circle cx="480" cy="170" r="7" fill="#2b6aff" stroke="#12162a" stroke-width="2"/>
  <rect x="408" y="188" width="144" height="88" rx="10" fill="url(#cardGrad)" stroke="rgba(79,140,255,0.25)"/>
  <text x="420" y="208" fill="#4f8cff" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700">27. 5. 2025</text>
  <text x="420" y="228" fill="#e8edf5" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">Registrace RP</text>
  <text x="420" y="246" fill="#8892b0" font-family="Inter, system-ui, sans-serif" font-size="10">IR 2025/848</text>
  <text x="420" y="262" fill="#8892b0" font-family="Inter, system-ui, sans-serif" font-size="10">Národní registry</text>

  <circle cx="660" cy="170" r="9" fill="#5de0ff" stroke="#12162a" stroke-width="2" filter="url(#glow)"/>
  <rect x="588" y="78" width="144" height="82" rx="10" fill="url(#cardGrad)" stroke="rgba(93,224,255,0.35)"/>
  <text x="600" y="98" fill="#5de0ff" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700">24. 12. 2026</text>
  <text x="600" y="118" fill="#e8edf5" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">Státy nabídnou</text>
  <text x="600" y="136" fill="#8892b0" font-family="Inter, system-ui, sans-serif" font-size="10">min. 1 certifikovanou</text>
  <text x="600" y="152" fill="#8892b0" font-family="Inter, system-ui, sans-serif" font-size="10">EUDIW (čl. 5a)</text>
  <line x1="660" y1="160" x2="660" y2="163" stroke="rgba(93,224,255,0.5)" stroke-width="1"/>

  <circle cx="840" cy="170" r="9" fill="#7c3aed" stroke="#12162a" stroke-width="2" filter="url(#glow)"/>
  <rect x="756" y="188" width="156" height="96" rx="10" fill="url(#cardGrad)" stroke="rgba(124,58,237,0.35)"/>
  <text x="768" y="208" fill="#b8a8ff" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700">24. 12. 2027</text>
  <text x="768" y="228" fill="#e8edf5" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">Povinná akceptace</text>
  <text x="768" y="246" fill="#8892b0" font-family="Inter, system-ui, sans-serif" font-size="10">Regulované RP + VLOP</text>
  <text x="768" y="262" fill="#8892b0" font-family="Inter, system-ui, sans-serif" font-size="10">na žádost uživatele</text>
  <text x="768" y="276" fill="#8892b0" font-family="Inter, system-ui, sans-serif" font-size="10">(čl. 5f)</text>

  <text x="120" y="300" text-anchor="middle" fill="#5a6480" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600">2024</text>
  <text x="300" y="300" text-anchor="middle" fill="#5a6480" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600">2024</text>
  <text x="480" y="300" text-anchor="middle" fill="#5a6480" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600">2025</text>
  <text x="660" y="300" text-anchor="middle" fill="#5a6480" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600">2026</text>
  <text x="840" y="300" text-anchor="middle" fill="#5a6480" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600">2027</text>
</svg>
